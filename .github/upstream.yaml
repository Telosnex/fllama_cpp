# Upstream sources, checked daily by the Upstream watch workflow
# (telosnex_ci_tools, lib/src/upstream.dart). Set `seen` to skip an update.
# Native and web use the llama.cpp commit that wllama pins (README), so the
# update to follow is wllama's. It moves often: alert after a week.
sources:
  - name: wllama (and its llama.cpp)
    branch: https://github.com/ngxson/wllama
    pin: {file: web_build/wllama.json, pattern: '^  "commit":\s*"([0-9a-f]{40})"'}
    lag_days: 7
  # A backstop: alerts when llama.cpp is a month past our commit, so we hear
  # of it even if wllama stops following. llama.cpp makes a release for almost
  # every commit, so an alert on each would fire daily.
  - name: llama.cpp
    branch: https://github.com/ggml-org/llama.cpp
    pin: {file: web_build/wllama.json, pattern: '"llamaCpp":\s*\{[^}]*?"commit":\s*"([0-9a-f]{40})"'}
    lag_days: 30
