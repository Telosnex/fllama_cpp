# Publishes fllama_cpp to pub.dev from a release tag
# (pub-fllama_cpp-v1.2.3), with telosnex_ci_tools' pub_publish.yml. On pub.dev,
# the package's Admin page allows automated publishing from this repository:
# tag pattern pub-fllama_cpp-v{{version}}, environment pub.dev.
name: Pub publish

on:
  push:
    tags: ['pub-fllama_cpp-v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  publish:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/pub_publish.yml@6297b4dbe04372d8f73b1ab775afd16f938c6e23 # v0.5.11
    permissions:
      contents: write # the published branch
      id-token: write
    with:
      test: flutter test --no-pub test/
